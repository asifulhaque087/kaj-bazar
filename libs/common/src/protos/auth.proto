syntax = "proto3";

package auth;

service AuthService {
  rpc Register (RegisterBody) returns (RegisterResponse) {}
  rpc Login(LoginBody) returns (LoginResponse) {}
  rpc RefreshAccessToken(RefreshAccessTokenBody) returns (RefreshAccessTokenResponse) {}
  rpc ValidateSocialUser(ValidateSocialUserBody) returns (ValidateSocialUserResponse) {}
}


message ValidateSocialUserBody {
  string  username = 1;
  string email = 2;
  optional string country = 4;
  optional string profilePicture = 5;
  string provider = 6;
}


message ValidateSocialUserResponse {
  string  username = 1;
  string email = 2;
  optional string country = 3;
  optional string profilePicture = 4;
  string id = 5;
  string accessToken = 6;
  string refreshToken = 7;
}





message RefreshAccessTokenBody {
  string token = 1;
}

message RefreshAccessTokenResponse {
  string newAccessToken = 1;
  string newAccessTokenExp = 2;
  string newRefreshToken = 3;
  string newRefreshTokenExp = 4;
}

message RegisterBody {
  string  username = 1;
  string email = 2;
  string password = 3; 
  optional string country = 4;
  optional string profilePicture = 5;
}

message RegisterResponse {
  string  username = 1;
  string email = 2;
  optional string country = 3;
  optional string profilePicture = 4;
  string id = 5;
  string accessToken = 6;
  string refreshToken = 7;
}


message LoginBody {
  string email = 1;
  string password = 2; 
}

message LoginResponse {
  string  username = 1;
  string email = 2;
  optional string country = 3;
  optional string profilePicture = 4;
  string id = 5;
  string accessToken = 6;
  string refreshToken = 7;
}