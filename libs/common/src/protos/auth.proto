syntax = "proto3";

package auth;

service AuthService {
  rpc Register (RegisterBody) returns (RegisterResponse) {}
  rpc ResendVerificationLink(ResendVerificationLinkBody) returns (CommonResponse) {}
  rpc VerifyEmail(VerifyEmailBody) returns (CommonResponse) {}
  rpc Login(LoginBody) returns (LoginResponse) {}
  rpc ValidateSocialUser(ValidateSocialUserBody) returns (ValidateSocialUserResponse) {}
  rpc ForgotPassword(ForgotPasswordBody) returns (CommonResponse) {}
  rpc ResetPassword(ResetPasswordBody) returns (CommonResponse) {}
  rpc ChangePassword(ChangePasswordBody) returns (CommonResponse) {}
  rpc WhoAmI(Empty) returns (User) {}
  rpc RefreshAccessToken(RefreshAccessTokenBody) returns (RefreshAccessTokenResponse) {}
}

message Empty {}

message User {
  string  id = 1;
  string  username = 2;
  string email = 3;
  optional string country = 4;
  optional string profilePicture = 5;
  bool emailVerified = 6;
}

message ChangePasswordBody {
  string email = 1;
  string password = 2;
}

message ResetPasswordBody {
  string token = 1;
  string password = 2;
}

message ForgotPasswordBody {
  string email = 1;
}

message ResendVerificationLinkBody {
  string email = 1;
}

message VerifyEmailBody {
  string token = 1;
}

message CommonResponse {
  string  message = 1;
}


message ValidateSocialUserBody {
  string  username = 1;
  string email = 2;
  optional string country = 4;
  optional string profilePicture = 5;
  string provider = 6;
}


message ValidateSocialUserResponse {
  string  username = 1;
  string email = 2;
  optional string country = 3;
  optional string profilePicture = 4;
  string id = 5;
  string accessToken = 6;
  string refreshToken = 7;
}





message RefreshAccessTokenBody {
  string token = 1;
}

message RefreshAccessTokenResponse {
  string newAccessToken = 1;
  string newAccessTokenExp = 2;
  string newRefreshToken = 3;
  string newRefreshTokenExp = 4;
}

message RegisterBody {
  string  username = 1;
  string email = 2;
  string password = 3; 
  optional string country = 4;
  optional string profilePicture = 5;
}

message RegisterResponse {
  string  username = 1;
  string email = 2;
  optional string country = 3;
  optional string profilePicture = 4;
  string id = 5;
  string accessToken = 6;
  string refreshToken = 7;
}


message LoginBody {
  string email = 1;
  string password = 2; 
}

message LoginResponse {
  string  username = 1;
  string email = 2;
  optional string country = 3;
  optional string profilePicture = 4;
  string id = 5;
  string accessToken = 6;
  string refreshToken = 7;
}