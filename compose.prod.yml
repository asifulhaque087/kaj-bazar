name: kaj-bazar-prod

volumes:
  auth-db-data:
  user-db-data:
  gig-db-data:
  chat-db-data:
  rabbitmq-data:

services:
  rabbitmq:
    container_name: rabbitmq_container
    image: rabbitmq:3.13-rc-management-alpine
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=kaj_bazar
      - RABBITMQ_DEFAULT_PASS=kaj_bazarpass
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmqctl', 'status']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    container_name: auth_db_container
    image: postgres:13-alpine
    restart: unless-stopped
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    env_file:
      - ./apps/auth/.env

  user-db:
    container_name: user_db_container
    image: postgres:13-alpine
    restart: unless-stopped
    volumes:
      - user-db-data:/var/lib/postgresql/data
    env_file:
      - ./apps/user/.env

  gig-db:
    container_name: gig_db_container
    image: postgres:13-alpine
    restart: unless-stopped
    volumes:
      - gig-db-data:/var/lib/postgresql/data
    env_file:
      - ./apps/gig/.env

  chat-db:
    container_name: chat_db_container
    image: postgres:13-alpine
    restart: unless-stopped
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    env_file:
      - ./apps/chat/.env

  redis:
    container_name: redis_container
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
      target: production
    image: asiful087/kaj-bazar-gateway
    env_file:
      - ./apps/gateway/.env
    environment:
      - AUTH_GRPC_URL=auth:50051
      - USER_GRPC_URL=user:50052
      - GIG_GRPC_URL=gig:50053
      - CHAT_GRPC_URL=chat:50054
    ports:
      - '3001:3001'
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth:
        condition: service_started
      user:
        condition: service_started
      gig:
        condition: service_started
      chat:
        condition: service_started

  email:
    build:
      context: .
      dockerfile: ./apps/email/Dockerfile
      target: production
    image: asiful087/kaj-bazar-email
    env_file:
      - ./apps/email/.env
    environment:
      - RABBITMQ_URL=amqp://kaj_bazar:kaj_bazarpass@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: production
    image: asiful087/kaj-bazar-auth
    env_file:
      - ./apps/auth/.env
    environment:
      - DATABASE_URL=postgresql://billu:random-password@auth-db:5432/auth
      - RABBITMQ_URL=amqp://kaj_bazar:kaj_bazarpass@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-db:
        condition: service_started

  user:
    build:
      context: .
      dockerfile: ./apps/user/Dockerfile
      target: production
    image: asiful087/kaj-bazar-user
    env_file:
      - ./apps/user/.env
    environment:
      - DATABASE_URL=postgresql://billu:random-password@user-db:5432/user
      - RABBITMQ_URL=amqp://kaj_bazar:kaj_bazarpass@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-db:
        condition: service_started

  gig:
    build:
      context: .
      dockerfile: ./apps/gig/Dockerfile
      target: production
    image: asiful087/kaj-bazar-gig
    env_file:
      - ./apps/gig/.env
    environment:
      - DATABASE_URL=postgresql://billu:random-password@gig-db:5432/gig
    depends_on:
      rabbitmq:
        condition: service_healthy
      gig-db:
        condition: service_started

  chat:
    build:
      context: .
      dockerfile: ./apps/chat/Dockerfile
      target: production
    image: asiful087/kaj-bazar-chat
    env_file:
      - ./apps/chat/.env
    environment:
      - DATABASE_URL=postgresql://billu:random-password@chat-db:5432/chat
      - REDIS_HOST=redis
    depends_on:
      rabbitmq:
        condition: service_healthy
      chat-db:
        condition: service_started
      redis:
        condition: service_healthy
