name: kaj-bazar-nest

services:
  rabbitmq:
    container_name: rabbitmq_container
    image: rabbitmq:3.13-rc-management-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=kaj_bazar
      - RABBITMQ_DEFAULT_PASS=kaj_bazarpass
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmqctl', 'status']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    container_name: auth_db_container
    image: postgres:13-alpine
    restart: always
    env_file:
      - ./apps/auth/.env

  user-db:
    container_name: user_db_container
    image: postgres:13-alpine
    restart: always
    env_file:
      - ./apps/user/.env

  gig-db:
    container_name: gig_db_container
    image: postgres:13-alpine
    restart: always
    env_file:
      - ./apps/gig/.env

  chat-db:
    container_name: chat_db_container
    image: postgres:13-alpine
    restart: always
    env_file:
      - ./apps/chat/.env

  redis:
    container_name: redis_container
    image: redis:7-alpine
    restart: always
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
      target: development
    command: >
      sh -c "
        pnpm --filter @app/common run build &&
        pnpm --filter @kaj-bazar/gateway run dev
      "
    env_file:
      - ./apps/gateway/.env
    ports:
      - '3001:3001'
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path: package.json

  email:
    build:
      context: .
      dockerfile: ./apps/email/Dockerfile
      target: development
    command: >
      sh -c "
        pnpm --filter @app/common run build &&
        pnpm --filter @kaj-bazar/email run dev
      "
    env_file:
      - ./apps/email/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path: package.json

  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: development
    # command: pnpm --filter @kaj-bazar/auth run dev
    command: >
      sh -c "
        pnpm --filter @app/common run build &&
        sleep 5 &&
        pnpm --filter @kaj-bazar/auth run db:push &&
        pnpm --filter @kaj-bazar/auth run dev
      "
    ports:
      - 4983:4983
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-db:
        condition: service_started
    env_file:
      - ./apps/auth/.env
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path: package.json

  user:
    build:
      context: .
      dockerfile: ./apps/user/Dockerfile
      target: development
    # command: pnpm --filter @kaj-bazar/user run dev
    command: >
      sh -c "
        pnpm --filter @app/common run build &&
        sleep 5 &&
        pnpm --filter @kaj-bazar/user run db:push &&
        pnpm --filter @kaj-bazar/user run dev
      "
    ports:
      - 4984:4984
    depends_on:
      rabbitmq:
        condition: service_healthy
      user-db:
        condition: service_started
    env_file:
      - ./apps/user/.env
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path: package.json

  gig:
    build:
      context: .
      dockerfile: ./apps/gig/Dockerfile
      target: development
    # command: pnpm --filter @kaj-bazar/user run dev
    command: >
      sh -c "
        pnpm --filter @app/common run build &&
        sleep 5 &&
        pnpm --filter @kaj-bazar/gig run db:push &&
        pnpm --filter @kaj-bazar/gig run dev
      "
    ports:
      - 4985:4985
    depends_on:
      rabbitmq:
        condition: service_healthy
      gig-db:
        condition: service_started
    env_file:
      - ./apps/gig/.env
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path: package.json

  chat:
    build:
      context: .
      dockerfile: ./apps/chat/Dockerfile
      target: development
    command: >
      sh -c "
        pnpm --filter @app/common run build &&
        sleep 5 &&
        pnpm --filter @kaj-bazar/chat run db:push &&
        pnpm --filter @kaj-bazar/chat run dev
      "
    ports:
      - 4986:4986
    environment:
      - REDIS_HOST=redis
    depends_on:
      rabbitmq:
        condition: service_healthy
      chat-db:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - ./apps/chat/.env
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path: package.json
