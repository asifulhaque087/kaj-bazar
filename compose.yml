name: kaj-bazar-nest

services:
  rabbitmq:
    container_name: rabbitmq_container
    image: rabbitmq:3.13-rc-management-alpine
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=kaj_bazar
      - RABBITMQ_DEFAULT_PASS=kaj_bazarpass
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmqctl', 'status']
      interval: 10s
      timeout: 5s
      retries: 5

  auth-db:
    container_name: auth_db_container
    image: postgres:13-alpine
    restart: always
    env_file:
      - ./apps/auth/.env

  gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
      target: development
    command: pnpm run start:dev gateway
    env_file:
      - ./apps/gateway/.env
    ports:
      - '3001:3001'
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path: package.json

  email:
    build:
      context: .
      dockerfile: ./apps/email/Dockerfile
      target: development
    command: pnpm run start:dev email
    env_file:
      - ./apps/email/.env
    # ports:
    #   - '3001:3001'
    depends_on:
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path: package.json

  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: development
    # command: pnpm run start:dev auth
    command: >
      sh -c "
        sleep 5 && 
        pnpm --filter @kaj-bazar/auth run db:push && 
        pnpm run start:dev auth
      "

    ports:
      - 4983:4983
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-db:
        condition: service_started

    env_file:
      - ./apps/auth/.env

    # ports:
    #   - '3002:3002'

    develop:
      watch:
        - action: sync
          path: .
          target: /usr/src/app
          ignore:
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path: package.json
