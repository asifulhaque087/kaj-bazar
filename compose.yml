name: kaj-bazar-nest

services:
  gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
      target: development
    command: pnpm run start:dev gateway
    env_file:
      - ./apps/gateway/.env
    ports:
      - '3001:3001'
    develop:
      watch:
        - action: sync
          path : .
          target: /usr/src/app
          ignore: 
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path : package.json

  auth:
    build:
      context: .
      dockerfile: ./apps/auth/Dockerfile
      target: development
    command: pnpm run start:dev auth
    env_file:
      - ./apps/auth/.env

    # ports:
    #   - '3002:3002'

    develop:
      watch:
        - action: sync
          path : .
          target: /usr/src/app
          ignore: 
            - node_modules/
            - .git/
            - dist/
        - action: rebuild
          path : package.json

