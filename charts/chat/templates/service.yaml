apiVersion: v1
kind: Service
metadata:
  name: {{ include "chat.fullname" . }}
  labels:
    app: {{ include "chat.name" . }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.env.GRPC_PORT }}
      protocol: TCP
      name: grpc
  selector:
    app: {{ include "chat.name" . }}
    release: {{ .Release.Name }}
