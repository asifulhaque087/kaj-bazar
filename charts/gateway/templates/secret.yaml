apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gateway.fullname" . }}
  labels:
    app: {{ include "gateway.name" . }}
    release: {{ .Release.Name }}
type: Opaque
stringData:
  ACCESS_TOKEN_SECRET: {{ .Values.secrets.ACCESS_TOKEN_SECRET | quote }}
  ACCESS_TOKEN_EXPIRATION: {{ .Values.secrets.ACCESS_TOKEN_EXPIRATION | quote }}
  REFRESH_TOKEN_SECRET: {{ .Values.secrets.REFRESH_TOKEN_SECRET | quote }}
  REFRESH_TOKEN_EXPIRATION: {{ .Values.secrets.REFRESH_TOKEN_EXPIRATION | quote }}
  AUTH_GATEWAY_SECRET: {{ .Values.secrets.AUTH_GATEWAY_SECRET | quote }}
  USER_GATEWAY_SECRET: {{ .Values.secrets.USER_GATEWAY_SECRET | quote }}
  GIG_GATEWAY_SECRET: {{ .Values.secrets.GIG_GATEWAY_SECRET | quote }}
  CHAT_GATEWAY_SECRET: {{ .Values.secrets.CHAT_GATEWAY_SECRET | quote }}
  ORDER_GATEWAY_SECRET: {{ .Values.secrets.ORDER_GATEWAY_SECRET | quote }}
  REVIEW_GATEWAY_SECRET: {{ .Values.secrets.REVIEW_GATEWAY_SECRET | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.GOOGLE_CLIENT_ID | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.GOOGLE_CLIENT_SECRET | quote }}
  AUTH_GRPC_URL: {{ .Values.secrets.AUTH_GRPC_URL | quote }}
  USER_GRPC_URL: {{ .Values.secrets.USER_GRPC_URL | quote }}
  GIG_GRPC_URL: {{ .Values.secrets.GIG_GRPC_URL | quote }}
  CHAT_GRPC_URL: {{ .Values.secrets.CHAT_GRPC_URL | quote }}
  CLIENT_URL: {{ .Values.secrets.CLIENT_URL | quote }}
  GATEWAY_URL: {{ .Values.secrets.GATEWAY_URL | quote }}
