name: Deploy Auth

on:
  push:
    branches: [main]
    paths:
      - 'apps/auth/**'
      - 'charts/auth/**'
      - 'packages/common/**'
      - '.github/workflows/deploy-auth.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/auth/**'
      - 'charts/auth/**'
      - 'packages/common/**'
      - '.github/workflows/deploy-auth.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Short Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/auth/Dockerfile
          target: production
          push: true
          tags: |
            asiful087/kaj-bazar-auth:${{ steps.vars.outputs.sha_short }}
            asiful087/kaj-bazar-auth:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install auth ./charts/auth \
            --namespace kaj-bazar --create-namespace \
            --set image.tag=${{ steps.vars.outputs.sha_short }} \
            --set secrets.DATABASE_URL="${{ secrets.AUTH_DATABASE_URL }}" \
            --set secrets.ACCESS_TOKEN_SECRET="${{ secrets.ACCESS_TOKEN_SECRET }}" \
            --set secrets.REFRESH_TOKEN_SECRET="${{ secrets.REFRESH_TOKEN_SECRET }}" \
            --set secrets.GATEWAY_SECRET="${{ secrets.AUTH_GATEWAY_SECRET }}" \
            --set secrets.RABBITMQ_URL="${{ secrets.RABBITMQ_URL }}" \
            --set secrets.CLIENT_URL="${{ secrets.CLIENT_URL }}" \
            --wait
