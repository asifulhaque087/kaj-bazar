name: Deploy Auth

on:
  push:
    branches: [nest-microservice]
    paths:
      - 'apps/auth/**'
      - 'charts/auth/**'
      - 'packages/common/**'
      - '.github/workflows/deploy-auth.yml'
      
  pull_request:
    branches: [nest-microservice]
    paths:
      - 'apps/auth/**'
      - 'charts/auth/**'
      - 'packages/common/**'
      - '.github/workflows/deploy-auth.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Short Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/auth/Dockerfile
          target: production
          push: true
          tags: |
            asiful087/kaj-bazar-auth:${{ steps.vars.outputs.sha_short }}
            asiful087/kaj-bazar-auth:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Kubernetes
        env:
          DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          GRPC_PORT: ${{ secrets.AUTH_GRPC_PORT }}
          ACCESS_TOKEN_SECRET: ${{ secrets.AUTH_ACCESS_TOKEN_SECRET }}
          ACCESS_TOKEN_EXPIRATION: ${{ secrets.AUTH_ACCESS_TOKEN_EXPIRATION }}
          REFRESH_TOKEN_SECRET: ${{ secrets.AUTH_REFRESH_TOKEN_SECRET }}
          REFRESH_TOKEN_EXPIRATION: ${{ secrets.AUTH_REFRESH_TOKEN_EXPIRATION }}
          GATEWAY_SECRET: ${{ secrets.AUTH_GATEWAY_SECRET }}
          RABBITMQ_URL: ${{ secrets.AUTH_RABBITMQ_URL }}
          CLIENT_URL: ${{ secrets.AUTH_CLIENT_URL }}
        run: |
          cat <<EOF > secrets.tmp.yaml
          secrets:
            DATABASE_URL: "$DATABASE_URL"
            GRPC_PORT: "$GRPC_PORT"
            ACCESS_TOKEN_SECRET: "$ACCESS_TOKEN_SECRET"
            ACCESS_TOKEN_EXPIRATION: "$ACCESS_TOKEN_EXPIRATION"
            REFRESH_TOKEN_SECRET: "$REFRESH_TOKEN_SECRET"
            REFRESH_TOKEN_EXPIRATION: "$REFRESH_TOKEN_EXPIRATION"
            GATEWAY_SECRET: "$GATEWAY_SECRET"
            RABBITMQ_URL: "$RABBITMQ_URL"
            CLIENT_URL: "$CLIENT_URL"
          EOF

          helm upgrade --install kajbazar-auth ./charts/auth \
            --namespace kaj-bazar --create-namespace \
            --set image.tag=${{ steps.vars.outputs.sha_short }} \
            --values secrets.tmp.yaml \
            --wait

          rm -f secrets.tmp.yaml
