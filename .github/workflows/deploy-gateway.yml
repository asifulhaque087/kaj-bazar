name: Deploy Gateway

on:
  push:
    branches: [main]
    paths:
      - 'apps/gateway/**'
      - 'charts/gateway/**'
      - 'packages/common/**'
      - '.github/workflows/deploy-gateway.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/gateway/**'
      - 'charts/gateway/**'
      - 'packages/common/**'
      - '.github/workflows/deploy-gateway.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Short Git SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/gateway/Dockerfile
          target: production
          push: true
          tags: |
            asiful087/kaj-bazar-gateway:${{ steps.vars.outputs.sha_short }}
            asiful087/kaj-bazar-gateway:latest

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy to Kubernetes
        run: |
          helm upgrade --install gateway ./charts/gateway \
            --namespace kaj-bazar --create-namespace \
            --set image.tag=${{ steps.vars.outputs.sha_short }} \
            --set secrets.ACCESS_TOKEN_SECRET="${{ secrets.ACCESS_TOKEN_SECRET }}" \
            --set secrets.REFRESH_TOKEN_SECRET="${{ secrets.REFRESH_TOKEN_SECRET }}" \
            --set secrets.AUTH_GATEWAY_SECRET="${{ secrets.AUTH_GATEWAY_SECRET }}" \
            --set secrets.USER_GATEWAY_SECRET="${{ secrets.USER_GATEWAY_SECRET }}" \
            --set secrets.GIG_GATEWAY_SECRET="${{ secrets.GIG_GATEWAY_SECRET }}" \
            --set secrets.CHAT_GATEWAY_SECRET="${{ secrets.CHAT_GATEWAY_SECRET }}" \
            --set secrets.ORDER_GATEWAY_SECRET="${{ secrets.ORDER_GATEWAY_SECRET }}" \
            --set secrets.REVIEW_GATEWAY_SECRET="${{ secrets.REVIEW_GATEWAY_SECRET }}" \
            --set secrets.GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --set secrets.GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --wait
